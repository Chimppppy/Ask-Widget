<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>Select a region</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        overflow: hidden;
        cursor: crosshair;
        user-select: none;
        background: #000;
      }

      /* the frozen screen, sitting at exactly the size of the display so a
         rectangle drawn here maps straight onto the captured pixels */
      #frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        -webkit-user-drag: none;
      }

      /* one dim layer over everything, lifted before a drag starts and then
         replaced by the shadow cast out of the selection box */
      #veil {
        position: fixed;
        inset: 0;
        background: rgba(16, 16, 15, 0.42);
      }

      #veil.picking { background: transparent; }

      #sel {
        position: fixed;
        display: none;
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 0 100vmax rgba(16, 16, 15, 0.42);
        pointer-events: none;
      }

      #sel.on { display: block; }

      #size {
        position: fixed;
        display: none;
        padding: 3px 7px;
        border-radius: 6px;
        background: rgba(16, 16, 15, 0.86);
        color: #ededec;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        white-space: nowrap;
      }

      #size.on { display: block; }

      #hint {
        position: fixed;
        top: 26px;
        left: 50%;
        transform: translateX(-50%);
        padding: 9px 15px;
        border-radius: 11px;
        background: rgba(16, 16, 15, 0.86);
        color: #ededec;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        font-size: 12.5px;
        letter-spacing: -0.008em;
        pointer-events: none;
        transition: opacity 0.15s ease;
      }

      #hint.gone { opacity: 0; }

      kbd {
        font: inherit;
        padding: 1px 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.14);
      }
    </style>
  </head>
  <body>
    <img id="frame" alt="" />
    <div id="veil"></div>
    <div id="sel"></div>
    <div id="size"></div>
    <div id="hint">Drag to pick a region &nbsp;·&nbsp; <kbd>Esc</kbd> to cancel</div>
    <script src="overlay.js"></script>
  </body>
</html>
